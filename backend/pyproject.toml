[project]
name = "backend"
version = "0.1.0"
description = "Redact - Git Secrets Auditor Backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.34,<1",
    "celery>=5.4,<6",
    "redis[hiredis]>=5.2,<6",
    "psycopg2-binary>=2.9,<3",
    "sqlalchemy>=2.0,<3",
    "alembic>=1.14,<2",
    "httpx>=0.28,<1",
    "weasyprint>=68,<69",
    "jinja2>=3.1,<4",
    "python-multipart>=0.0.18",
]

[dependency-groups]
dev = [
    "ruff>=0.15.12",
]
test = [
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.24,<1",
    "respx>=0.22,<1",
]
